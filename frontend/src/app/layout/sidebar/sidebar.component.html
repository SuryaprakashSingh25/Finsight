<aside class="sidebar">
  <a class="brand" href="#" (click)="$event.preventDefault(); select('Overview')">
    <span class="brand-mark">F</span>
    <span class="brand-copy">
      <strong>FinSight</strong>
      <small>FINANCIAL INTELLIGENCE</small>
    </span>
  </a>

  <div class="workspace-label">WORKSPACE</div>

  <nav class="navigation">
    @for (item of navigation; track item.label) {
      <button
        class="nav-item"
        [class.active]="activePage === item.label"
        (click)="select(item.label)"
        [title]="item.label"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
        @if (item.badge) {
          <span class="nav-badge">{{ item.badge }}</span>
        }
      </button>
    }
  </nav>

  <div class="sidebar-bottom">
    <div class="system-status">
      <span class="status-dot"></span>
      <span class="nav-label">Research engine ready</span>
    </div>

    <div class="profile">
      <div class="avatar">FS</div>
      <div class="profile-copy">
        <strong>Research workspace</strong>
        <small>Personal edition</small>
      </div>

      <!-- Functional options trigger -->
      <button
        class="profile-action-btn"
        [class.active]="isMenuOpen()"
        title="Workspace options"
        aria-label="Workspace options"
        (click)="toggleWorkspaceMenu($event)"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
          <circle cx="5" cy="12" r="1"></circle>
        </svg>
      </button>

      <!-- Floating Workspace Popup Menu -->
      @if (isMenuOpen()) {
        <div class="workspace-popup-menu" (click)="$event.stopPropagation()">
          <div class="menu-label">WORKSPACE CONTROLS</div>
          <button class="popup-item" (click)="refreshWorkspace()">
            <span class="popup-icon">↻</span>
            <span>Refresh Memory & Cache</span>
          </button>
          <button class="popup-item" (click)="toggleFullScreen()">
            <span class="popup-icon">⛶</span>
            <span>Toggle Fullscreen</span>
          </button>
          <div class="popup-divider"></div>
          <div class="version-tag">FinSight Engine &bull; Port 8081 Active</div>
        </div>
      }
    </div>
  </div>
</aside>
